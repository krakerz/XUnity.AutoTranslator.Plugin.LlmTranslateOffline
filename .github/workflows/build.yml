name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_FILE: XUnity.AutoTranslator.Plugin.LlmTranslateOffline.csproj
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_FILE")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from $PROJECT_FILE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            /^## \[/ { if (f) exit; if (index($0, "[" ver "]") > 0) { f=1 }; next }
            f { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${{ steps.version.outputs.version }}. Add one before pushing to main." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release "$PROJECT_FILE"

      - name: Stage release bundle
        run: |
          STAGE=staging/LlmTranslateOffline
          mkdir -p "$STAGE"
          cp bin/Release/XUnity.AutoTranslator.Plugin.LlmTranslateOffline.dll "$STAGE/"
          cp examples/LlmTranslateOffline.example.yaml "$STAGE/"
          cp packaging/INSTALL.txt "$STAGE/"
          (cd staging && zip -r "../LlmTranslateOffline-v${{ steps.version.outputs.version }}.zip" LlmTranslateOffline)

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: LlmTranslateOffline-v${{ steps.version.outputs.version }}.zip
