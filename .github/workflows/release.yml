name: Build & draft release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

env:
  PROJECT_FILE: XUnity.AutoTranslator.Plugin.LlmTranslateOffline.csproj
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_FILE")
          if [ -z "$VERSION" ]; then
            echo "Could not read <Version> from $PROJECT_FILE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release "$PROJECT_FILE"

      - name: Extract changelog section for this version
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for version ${{ steps.version.outputs.version }}." > release_notes.md
          fi

      - name: Stage release bundle
        run: |
          STAGE=staging/LlmTranslateOffline
          mkdir -p "$STAGE"
          cp "bin/Release/XUnity.AutoTranslator.Plugin.LlmTranslateOffline.dll" "$STAGE/"
          cp "examples/LlmTranslateOffline.example.yaml" "$STAGE/"
          cp "packaging/INSTALL.txt" "$STAGE/"
          (cd staging && zip -r "../LlmTranslateOffline-v${{ steps.version.outputs.version }}.zip" LlmTranslateOffline)

      - name: Build unique release tag
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}-pr${{ github.event.pull_request.number }}.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "v${{ steps.version.outputs.version }} (PR #${{ github.event.pull_request.number }}, build ${{ github.run_number }})"
          body_path: release_notes.md
          draft: true
          files: LlmTranslateOffline-v${{ steps.version.outputs.version }}.zip
