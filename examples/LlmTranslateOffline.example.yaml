# XUnity.AutoTranslator LLM Translate (Offline) endpoint configuration.
# This is an example file. XUnity.AutoTranslator.Plugin.LlmTranslateOffline generates
# BepInEx/config/LlmTranslateOffline.yaml automatically on first run with the same
# structure and defaults shown here — you don't need to copy this file manually.
# Edit the generated file and restart the game to apply changes.
# To use this endpoint, set Endpoint=LlmTranslateOffline in AutoTranslatorConfig.ini.

# Base URL of the OpenAI-compatible chat-completions endpoint.
# LM Studio default:  http://localhost:1234/v1/chat/completions
# Ollama (OpenAI-compatible) default: http://localhost:11434/v1/chat/completions
Endpoint: http://localhost:1234/v1/chat/completions

# API key sent as "Authorization: Bearer <ApiKey>". Leave empty if your server doesn't need one.
ApiKey: ""

# Model name/id exactly as your server expects it.
Model: local-model

# --- Alternative endpoint(s) (optional) ---
# If the primary Endpoint above fails (connection error, timeout, or a non-200
# response), this plugin retries the same request against each alternative below, in
# order, using the same prompts and sampling settings. Leave AlternativeEndpoint empty
# (default) to disable this and only ever use the primary endpoint.
#
# Named "Alternative", not "Fallback", so it isn't confused with AutoTranslatorConfig.ini's
# own FallbackEndpoint setting, which is a different, unrelated feature (it switches to a
# completely different translator service, e.g. FallbackEndpoint=GoogleTranslateV2).
#
# Example: LM Studio as primary, Ollama as alternative (or the other way around,
# or two LM Studio/Ollama instances on different ports).
AlternativeEndpoint: ""
AlternativeApiKey: ""
AlternativeModel: ""

# Add more alternatives by numbering the keys (tried in order after AlternativeEndpoint):
# AlternativeEndpoint2: http://localhost:11434/v1/chat/completions
# AlternativeApiKey2: ""
# AlternativeModel2: llama3

# How long to wait (in seconds) for an alternative endpoint to respond before giving up on it.
AlternativeTimeoutSeconds: 60

# Sampling parameters passed to the LLM.
Temperature: 0.3
TopP: 1.0
MaxTokens: 1000

# Strip <think>...</think> blocks that some local reasoning models emit.
StripReasoning: true

# Leave empty to use the SourceLanguage/DestinationLanguage from AutoTranslatorConfig.ini.
# Set these to override the language pair just for this endpoint.
SourceLanguage: ""
DestinationLanguage: ""

# System prompt sent as the "system" role message.
# Placeholders: {{SourceLanguage}}, {{DestinationLanguage}}
SystemPrompt: |
  You are a translation engine. Translate the given text from {{SourceLanguage}} to {{DestinationLanguage}}.
  Only output the translated text, with no explanations, notes, quotes or extra formatting.

# User prompt template sent as the "user" role message.
# Placeholders: {{SourceLanguage}}, {{DestinationLanguage}}, {{Input}}
UserPromptTemplate: |
  {{Input}}
